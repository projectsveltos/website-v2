<svg width="1517" height="1262" viewBox="0 0 1517 1262" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            @keyframes finRight {
                0%, 100% { transform: rotate(0deg) scale(1); }
                50%       { transform: rotate(15deg) scale(1.05); }
            }
            @keyframes finLeft {
                0%, 100% { transform: rotate(0deg) scale(1); }
                50%       { transform: rotate(-12deg) scale(1.05); }
            }
            @keyframes bubbleFloat {
                0%, 100% { transform: translateY(0px) scale(1); opacity: 1; }
                50%       { transform: translateY(-12px) scale(0.95); opacity: 0.6; }
            }
            .fin-right {
                transform-box: fill-box;
                transform-origin: 20% 20%;
                animation: finRight 1.8s ease-in-out infinite;
            }
            .fin-left {
                transform-box: fill-box;
                transform-origin: 80% 20%;
                animation: finLeft 2.2s ease-in-out infinite;
            }
            .bubble { animation: bubbleFloat 3s ease-in-out infinite; }
            .bubble-2 { animation: bubbleFloat 3s ease-in-out infinite 0.8s; }
            .bubble-3 { animation: bubbleFloat 3s ease-in-out infinite 1.6s; }
        </style>
    </defs>
